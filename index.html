<body><div id="app"><header class="app-header"><div><p class="eyebrow">FAMILY GIFT LEDGER</p><h1>유태현 축의금 장부</h1></div><button id="menu-button" class="secondary" aria-label="보관 및 설정">보관·설정</button></header><div id="storage-status" class="storage-status" role="status">기록을 불러오는 중입니다.</div><main id="view" aria-live="polite"></main><nav class="app-nav" aria-label="주요 메뉴"><button data-nav="records" aria-current="page">기록</button><button data-nav="compare">비교</button><button data-nav="settlement">정산</button></nav><div id="notice" role="status"></div><dialog id="modal"></dialog></div><script>(function(){const of=window.fetch.bind(window);window.fetch=async function(u,o){if(typeof u==='string'&&u.startsWith('/api/')){let pin=localStorage.getItem('gift-pin');if(!pin){pin=prompt('가족 PIN을 입력하세요');if(!pin)throw new Error('PIN이 필요합니다.');localStorage.setItem('gift-pin',pin.trim());pin=pin.trim();}o=Object.assign({},o);o.headers=Object.assign({},o.headers,{'x-pin':pin});const r=await of(u,o);if(r.status===401)localStorage.removeItem('gift-pin');return r;}return of(u,o);};})();</script><script type="module">class AppError extends Error { constructor(message,status=400){super(message);this.status=status;} }
const emptyState=()=>({schema:1,people:[],receipts:[],expenses:[],audit:[],settings:{weddingDate:'2026-11-14',referenceAsOf:'2024-10-28',referenceSummaryIncome:null}});
const id=()=>crypto.randomUUID();
const assert=(ok,msg)=>{if(!ok)throw new AppError(msg);};
const text=(s,max=500)=>typeof s==='string'&&s.length<=max;
function validDate(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T00:00:00Z');return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===s;}
const validAmount=n=>Number.isSafeInteger(n)&&n>0;
function validateState(s){
 assert(s&&s.schema===1&&Array.isArray(s.people)&&Array.isArray(s.receipts)&&Array.isArray(s.expenses)&&Array.isArray(s.audit),'지원하지 않는 백업 형식입니다.');
 assert(s.people.length<=20000&&s.receipts.length<=100000&&s.audit.length<=200000,'백업 데이터가 너무 큽니다.');
 const ids=new Set(),refs=new Set();
 for(const p of s.people){assert(text(p.id,100)&&p.id&&!ids.has(p.id),'명단 ID가 중복되거나 잘못되었습니다.');ids.add(p.id);assert(text(p.name,100)&&p.name.trim()&&text(p.group,100)&&p.group.trim(),'이름과 그룹을 확인해 주세요.');if(p.reference){const r=p.reference;assert(Number.isSafeInteger(r.originalNo)&&r.originalNo>0&&!refs.has(r.originalNo)&&validAmount(r.amount)&&text(r.name,100)&&text(r.group,100),'과거 원본 연결을 확인해 주세요.');refs.add(r.originalNo);}}
 const receiptIds=new Set();let sum=0;
 for(const r of s.receipts){assert(text(r.id,100)&&r.id&&!receiptIds.has(r.id)&&ids.has(r.personId)&&validAmount(r.amount)&&validDate(r.date)&&['봉투','계좌','카드','기타'].includes(r.method)&&text(r.note??'',500),'입금 기록의 ID·명단·금액·날짜·방법을 확인해 주세요.');assert(!r.cancelled||r.cancelled===true,'입금 취소 상태를 확인해 주세요.');receiptIds.add(r.id);if(!r.cancelled)sum+=r.amount;}
 assert(Number.isSafeInteger(sum),'총액이 허용 범위를 벗어났습니다.');
 const expenseIds=new Set();for(const x of s.expenses){assert(text(x.id,100)&&x.id&&!expenseIds.has(x.id)&&['taehyun','haein'].includes(x.event)&&['plan','actual'].includes(x.kind)&&validAmount(x.amount)&&text(x.category,100)&&x.category.trim()&&(!x.date||validDate(x.date))&&(!x.cancelled||x.cancelled===true),'비용 기록을 확인해 주세요.');expenseIds.add(x.id);}
 assert(s.settings&&validDate(s.settings.weddingDate)&&validDate(s.settings.referenceAsOf)&&(s.settings.referenceSummaryIncome===null||validAmount(s.settings.referenceSummaryIncome)),'행사와 원본 정보를 확인해 주세요.');
 for(const a of s.audit)assert(a&&text(a.operationId,100)&&a.operationId&&text(a.actor,250)&&text(a.action,100)&&text(a.at,100),'수정 이력 형식을 확인해 주세요.');
 return s;
}
function stats(s){const active=s.receipts.filter(r=>!r.cancelled),paid=new Set(active.map(r=>r.personId));return {total:active.reduce((a,r)=>a+r.amount,0),transactions:active.length,paid:paid.size,unrecorded:s.people.length-paid.size,reference:s.people.reduce((a,p)=>a+(p.reference?.amount||0),0)};}
const personTotal=(s,pid)=>s.receipts.filter(r=>r.personId===pid&&!r.cancelled).reduce((a,r)=>a+r.amount,0);
function applyOperation(state,op,actor,at=new Date().toISOString()){
 validateState(state);assert(op&&text(op.id,100)&&op.id&&text(op.type,100),'저장 요청 ID가 필요합니다.');
 const signature=JSON.stringify({type:op.type,body:op.body||{}}),previous=state.audit.find(a=>a.operationId===op.id);
 if(previous){if(previous.signature&&previous.signature!==signature)throw new AppError('같은 요청 ID의 내용이 변경되었습니다. 새 저장 요청으로 다시 시도해 주세요.',409);return {state,replayed:true};}
 const s=structuredClone(state),b=structuredClone(op.body||{});let before=null,after=null;
 const person=pid=>s.people.find(p=>p.id===pid);
 const payment=b=>{assert(person(b.personId),'명단을 선택해 주세요.');assert(validAmount(b.amount),'금액은 0원보다 큰 원 단위 정수여야 합니다.');assert(validDate(b.date),'입금일을 확인해 주세요.');assert(['봉투','계좌','카드','기타'].includes(b.method),'입금방법을 확인해 주세요.');assert(text(b.note??'',500),'메모는 500자 이내로 입력해 주세요.');return {personId:b.personId,amount:b.amount,date:b.date,method:b.method,note:b.note||''};};
 if(op.type==='addReceipt'){
  if(b.newPerson){const n=b.newPerson;assert(text(n.name,100)&&n.name.trim()&&text(n.group,100)&&n.group.trim()&&text(n.id,100)&&n.id,'새 명단의 이름과 그룹을 확인해 주세요.');assert(!person(n.id),'명단 ID가 이미 있습니다.');assert(!s.people.some(p=>p.name.replace(/\s/g,'')===n.name.replace(/\s/g,'')&&p.group===n.group),'같은 이름과 그룹의 명단이 있습니다. 기존 명단을 선택해 주세요.');s.people.push({id:n.id,name:n.name.trim(),group:n.group.trim(),invitation:'unknown',reference:null});b.personId=n.id;}
  const r=payment(b);assert(text(b.receiptId,100)&&b.receiptId&&!s.receipts.some(x=>x.id===b.receiptId),'입금 기록 ID가 이미 있습니다.');
  const same=s.receipts.find(x=>!x.cancelled&&x.personId===r.personId&&x.amount===r.amount&&x.date===r.date&&x.method===r.method);
  if(same&&!b.confirmSeparate)throw new AppError('같은 명단·날짜·금액·방법의 입금이 있습니다. 별도 추가 입금인지 확인해 주세요.',409);
  if(same)assert(text(b.reason,300)&&b.reason.trim(),'별도 입금 사유를 입력해 주세요.');
  after={id:b.receiptId,...r,cancelled:false,createdAt:at,createdBy:actor};s.receipts.push(after);
 }else if(op.type==='editReceipt'){
  const r=s.receipts.find(x=>x.id===b.receiptId);assert(r&&!r.cancelled,'수정할 유효 입금 기록을 찾을 수 없습니다.');assert(text(b.reason,300)&&b.reason.trim(),'수정 사유를 입력해 주세요.');before=structuredClone(r);const changes=payment({...b,personId:r.personId});Object.assign(r,changes,{updatedAt:at,updatedBy:actor});after=structuredClone(r);
 }else if(op.type==='cancelReceipt'){
  const r=s.receipts.find(x=>x.id===b.receiptId);assert(r&&!r.cancelled,'취소할 입금 기록을 찾을 수 없습니다.');assert(text(b.reason,300)&&b.reason.trim(),'취소 사유를 입력해 주세요.');before=structuredClone(r);Object.assign(r,{cancelled:true,cancelledAt:at,cancelledBy:actor});after=structuredClone(r);
 }else if(op.type==='addExpense'){
  assert(validAmount(b.amount)&&text(b.category,100)&&b.category.trim()&&['plan','actual'].includes(b.kind)&&validDate(b.date),'비용 항목·금액·계획/실적·날짜를 확인해 주세요.');assert(text(b.expenseId,100)&&b.expenseId&&!s.expenses.some(x=>x.id===b.expenseId),'비용 ID가 이미 있습니다.');after={id:b.expenseId,event:'taehyun',kind:b.kind,category:b.category.trim(),amount:b.amount,date:b.date,createdAt:at,createdBy:actor};s.expenses.push(after);
 }else if(op.type==='editExpense'||op.type==='cancelExpense'){
  const x=s.expenses.find(x=>x.id===b.expenseId&&x.event==='taehyun'&&!x.cancelled);assert(x,'수정할 현재 행사 비용을 찾을 수 없습니다.');assert(text(b.reason,300)&&b.reason.trim(),'비용 수정·취소 사유를 입력해 주세요.');before=structuredClone(x);
  if(op.type==='editExpense'){assert(validAmount(b.amount)&&text(b.category,100)&&b.category.trim()&&['plan','actual'].includes(b.kind)&&validDate(b.date),'비용 항목·금액·계획/실적·날짜를 확인해 주세요.');Object.assign(x,{amount:b.amount,category:b.category.trim(),kind:b.kind,date:b.date,updatedAt:at,updatedBy:actor});}
  else Object.assign(x,{cancelled:true,cancelledAt:at,cancelledBy:actor});after=structuredClone(x);
 }else if(op.type==='setInvitation'){
  const p=person(b.personId);assert(p&&['unknown','sent','notSent'].includes(b.value),'청첩 상태를 확인해 주세요.');before={personId:p.id,value:p.invitation};p.invitation=b.value;after={personId:p.id,value:p.invitation};
 }else throw new AppError('지원하지 않는 저장 요청입니다.');

}

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=n=>Number(n).toLocaleString('ko-KR'),won=n=>num(n)+'원';
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const LOCAL=!!window.GIFT_APP_LOCAL_SEED,KEY='family-gift-ledger-v1';
let state=emptyState(),revision=0,user={email:'이 기기',role:'admin'},tab='records',query='',group='',filter='all',sort='recent',page=1,compareMode='person',archive=false,storageReady=false,busy=false,selectedPerson=null,pendingOperation=null;
const groups=()=>state.people.length?[...new Set(state.people.map(p=>p.group))]:['기타'];
const activeReceipts=()=>state.receipts.filter(r=>!r.cancelled);
function status(message,error=false){$('#storage-status').textContent=message;$('#storage-status').classList.toggle('error',error);}
function notice(s){$('#notice').textContent=s;$('#notice').className='notice-on';}
function readLocal(){const raw=localStorage.getItem(KEY);return raw?JSON.parse(raw):null;}
async function reload(){
 if(LOCAL){const saved=readLocal();state=validateState(saved?.state||structuredClone(window.GIFT_APP_LOCAL_SEED));revision=saved?.revision||0;if(!saved)localStorage.setItem(KEY,JSON.stringify({state,revision}));storageReady=true;status('이 기기에 저장됨 · 다른 기기로 옮길 때 JSON 백업을 사용하세요.');}
 else{const r=await fetch('/api/state',{credentials:'same-origin',cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||'기록을 불러올 수 없습니다.');state=validateState(data.state);revision=data.revision;user=data.user;storageReady=true;status('서버 저장 연결 · '+user.email+' · '+(user.role==='viewer'?'조회 전용':'기록 가능'));}
}
async function mutate(op){
 if(!storageReady)throw Error('저장 연결을 확인해 주세요.');let result;
 if(LOCAL){const write=()=>{const saved=readLocal();const base=validateState(saved?.state||state),rev=saved?.revision||0;const applied=applyOperation(base,op,user.email);const packet={state:applied.state,revision:rev+(applied.replayed?0:1)};localStorage.setItem(KEY,JSON.stringify(packet));return packet;};result=navigator.locks?await navigator.locks.request(KEY,write):write();}
 else{let r;try{r=await fetch('/api/operations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(op),credentials:'same-origin'});}catch{const e=new Error('서버 응답을 확인하지 못했습니다. 같은 내용으로 다시 저장하면 중복 없이 확인합니다.');e.status=0;throw e;}result=await r.json();if(!r.ok){const e=new Error(result.error||'저장에 실패했습니다.');e.status=r.status;throw e;}}
 state=validateState(result.state);revision=result.revision;status(LOCAL?'이 기기에 저장 완료 · JSON 백업으로 기록을 보관하세요.':'서버 저장 완료 · '+user.email);return result;
}
const latest=pid=>state.receipts.filter(r=>r.personId===pid&&!r.cancelled).sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||'').localeCompare(a.createdAt||''))[0];
function filtered(){return state.people.filter(p=>(!archive||p.reference)&&(!group||p.group===group)&&(!query||(p.name+' '+p.group+' '+(p.reference?.note||'')).includes(query))&&(filter==='all'||(filter==='paid'?(archive?!!p.reference:personTotal(state,p.id)>0):(archive?!p.reference:personTotal(state,p.id)===0)))).sort((a,b)=>sort==='amount'?((archive?b.reference?.amount||0:personTotal(state,b.id))-(archive?a.reference?.amount||0:personTotal(state,a.id))):sort==='name'?a.name.localeCompare(b.name,'ko'):((latest(b.id)?.date||'').localeCompare(latest(a.id)?.date||''))||(a.reference?.originalNo||100000)-(b.reference?.originalNo||100000));}
function options(value='',all=true){return (all?'<option value="">모든 그룹</option>':'')+groups().map(g=>'<option value="'+esc(g)+'"'+(g===value?' selected':'')+'>'+esc(g)+'</option>').join('');}
function filterBar(){return '<div class="filters"><input type="search" id="query" class="search" value="'+esc(query)+'" placeholder="이름·그룹·과거 메모 검색" aria-label="명단 검색"><select id="group" aria-label="그룹 필터">'+options(group)+'</select><select id="sort" aria-label="정렬"><option value="recent"'+(sort==='recent'?' selected':'')+'>입금 최신순</option><option value="amount"'+(sort==='amount'?' selected':'')+'>금액 큰 순</option><option value="name"'+(sort==='name'?' selected':'')+'>이름순</option></select><div class="chips">'+[['all','전체'],['paid','입금 기록'],['unrecorded','미기록']].map(([v,t])=>'<button class="chip" data-filter="'+v+'" aria-pressed="'+(filter===v)+'">'+t+'</button>').join('')+'</div></div>';}
function paged(rows){const max=Math.max(1,Math.ceil(rows.length/12));page=Math.min(page,max);return rows.slice((page-1)*12,page*12);}
function pager(n){return '<div class="pager"><span class="subtle">'+(n?((page-1)*12+1)+'–'+Math.min(page*12,n):0)+' / '+n+'건</span><div><button class="secondary" data-page="-1"'+(page===1?' disabled':'')+'>이전</button> <button class="secondary" data-page="1"'+(page>=Math.ceil(n/12)?' disabled':'')+'>다음</button></div></div>';}
function listTable(compare=false){const list=filtered(),rows=paged(list);return '<div class="panel"><div class="panel-title"><h3>'+(compare?'명단별 비교':archive?'유해인 원본 명단':'축의금 명단')+'</h3><span class="subtle">'+list.length+'건 · 이름을 누르면 입금 이력</span></div><table class="ledger"><colgroup><col style="width:31%"><col style="width:23%"><col style="width:23%"><col style="width:23%"></colgroup><thead><tr><th>이름 / 그룹</th><th class="right">유해인</th><th class="right">유태현 누적</th><th class="right">'+(compare?'증감':'상태')+'</th></tr></thead><tbody>'+rows.map(p=>{const amount=personTotal(state,p.id),last=latest(p.id),ref=p.reference;return '<tr><td><button class="name-button" data-person="'+esc(p.id)+'">'+esc(p.name)+'</button><p class="subtle">'+esc(p.group)+'</p></td><td class="right num" data-label="유해인">'+(ref?won(ref.amount):'<span class="subtle">과거 기록 없음</span>')+'</td><td class="right num" data-label="유태현 누적">'+(amount?won(amount):'<span class="subtle">미기록</span>')+'</td><td class="right" data-label="'+(compare?'증감':'상태')+'">'+(compare?(amount&&ref?(amount-ref.amount>0?'+':'')+won(amount-ref.amount):'—'):'<span class="badge '+(archive?'neutral':amount?'ok':'neutral')+'">'+(archive?'과거 원본':amount?'입금 기록':'미기록')+'</span><p class="subtle">'+(last&&!archive?esc(last.date)+' · '+esc(last.method):ref?'원번호 '+ref.originalNo:'신규 명단')+'</p>')+'</td></tr>';}).join('')+(!rows.length?'<tr><td class="empty" colspan="4">검색 결과가 없습니다.</td></tr>':'')+'</tbody></table>'+pager(list.length)+'</div>';}
function recordsView(){const t=stats(state);return '<div class="topline"><div><h2>'+(archive?'유해인 과거 기록':'유태현 축의금 현황')+'</h2><p class="subtle leadline">'+state.settings.weddingDate+' 결혼식 · 큰 글씨 명단과 빠른 입력</p></div>'+(!archive&&user.role!=='viewer'?'<button class="primary" data-add>＋ 축의금 기록</button>':'')+'</div><div class="stats"><section class="stat hero"><p class="label">'+(archive?'유해인 과거 축의금':'현재까지 받은 축의금')+'</p><p class="value num">'+num(archive?t.reference:t.total)+'<span>원</span></p><p class="subtle">'+(archive?state.settings.referenceAsOf+' 자료 기준':'유효 입금 '+t.transactions+'건 · 명단 '+t.paid+'건')+'</p></section><section class="stat"><p class="label">'+(archive?'과거 원본 명단':'입금 기록')+'</p><p class="value num">'+(archive?state.people.filter(p=>p.reference).length:t.transactions)+'<span>건</span></p><p class="subtle">'+(archive?'원본을 보존합니다.':'한 명단에 여러 입금 가능')+'</p></section><section class="stat"><p class="label">'+(archive?'등록 그룹':'금액 미기록')+'</p><p class="value num">'+(archive?groups().length:t.unrecorded)+'<span>'+(archive?'개':'건')+'</span></p><p class="subtle">등록 명단 '+state.people.length+'건</p></section></div><div class="rowbar" style="margin-bottom:14px"><button class="chip" data-archive="false" aria-pressed="'+!archive+'">유태현 장부</button><button class="chip" data-archive="true" aria-pressed="'+archive+'">유해인 과거 기록</button></div>'+filterBar()+listTable()+'<p class="hint">미기록은 아직 금액을 입력하지 않은 상태입니다. 공동 명의는 한 명단으로 유지합니다.</p>';}
function reviewItems(){const names=new Map();for(const p of state.people){const key=p.name.replace(/\s/g,'');if(!names.has(key))names.set(key,[]);names.get(key).push(p);}const duplicates=[...names.values()].filter(pp=>pp.length>1);const groupAliases=new Map();for(const g of groups()){const key=g.replace(/\s/g,'');if(!groupAliases.has(key))groupAliases.set(key,[]);groupAliases.get(key).push(g);}return duplicates.map(pp=>'<p class="subtle">'+esc(pp[0].name)+': '+pp.map(p=>esc(p.group)+' '+(p.reference?'원번호 '+p.reference.originalNo:'신규 명단')).join(' / ')+' · 확인 전까지 각각 보존</p>').join('')+[...groupAliases.values()].filter(gs=>gs.length>1).map(gs=>'<p class="subtle">그룹명 통합 후보: '+gs.map(esc).join(' / ')+'</p>').join('')+'<p class="subtle">그룹명과 공동 명의는 원문을 보존합니다. 이름만 같다는 이유로 합치지 않습니다.</p>';}
function compareView(){const t=stats(state),groupRows=groups().filter(g=>!group||g===group);return '<div class="topline"><div><h2>유해인과 비교</h2><p class="subtle leadline">현재 누적과 과거 실적을 나란히 확인</p></div><div class="chips"><button class="chip" data-mode="person" aria-pressed="'+(compareMode==='person')+'">명단별</button><button class="chip" data-mode="group" aria-pressed="'+(compareMode==='group')+'">그룹별</button></div></div><div class="comparison"><section class="stat"><p class="label">유태현 현재 누적</p><p class="value num">'+num(t.total)+'<span>원</span></p><p class="subtle">'+t.transactions+'건 입금 · '+t.paid+'개 명단</p></section><section class="stat"><p class="label">유해인 과거 실적</p><p class="value num">'+num(t.reference)+'<span>원</span></p><p class="subtle">'+state.people.filter(p=>p.reference).length+'건 · '+state.settings.referenceAsOf+' 자료</p></section></div>'+(compareMode==='person'?filterBar()+listTable(true):'<div class="filters"><select id="group" aria-label="그룹 필터">'+options(group)+'</select></div><div class="panel"><div class="panel-title"><h3>그룹별 합계</h3></div><table class="ledger"><thead><tr><th>그룹</th><th>유해인</th><th>유태현</th><th>입금 명단</th></tr></thead><tbody>'+groupRows.map(g=>{const pp=state.people.filter(p=>p.group===g),ref=pp.reduce((a,p)=>a+(p.reference?.amount||0),0),sum=pp.reduce((a,p)=>a+personTotal(state,p.id),0);return '<tr><td>'+esc(g)+'<p class="subtle">'+pp.length+'건 명단</p></td><td class="num" data-label="유해인">'+(ref?won(ref):'기록 없음')+'</td><td class="num" data-label="유태현">'+(sum?won(sum):'미기록')+'</td><td data-label="입금 명단">'+pp.filter(p=>personTotal(state,p.id)>0).length+'건</td></tr>';}).join('')+'</tbody></table></div>')+'<p class="hint">미기록 또는 과거 기록이 없는 명단의 증감은 계산하지 않습니다. 행사 전체 총액은 진행 시점이 다른 참고 비교입니다.</p><details><summary>동명이인과 그룹명 확인 항목</summary>'+reviewItems()+'</details>';}
function settlementView(){const t=stats(state),past=state.expenses.filter(x=>x.event==='haein'),current=state.expenses.filter(x=>x.event==='taehyun'),actual=current.filter(x=>!x.cancelled&&x.kind==='actual').reduce((a,x)=>a+x.amount,0),plan=current.filter(x=>!x.cancelled&&x.kind==='plan').reduce((a,x)=>a+x.amount,0),gap=t.reference-state.settings.referenceSummaryIncome;return '<div class="topline"><div><h2>결혼 비용 정산</h2><p class="subtle leadline">계획 금액과 실제 지급을 구분합니다.</p></div>'+(user.role!=='viewer'?'<button class="primary" data-expense>＋ 비용 기록</button>':'')+'</div><div class="callout">유해인 명단 '+won(t.reference)+' / 정산표 '+won(state.settings.referenceSummaryIncome)+' · 차이 '+won(gap)+' 확인 필요</div><div class="comparison"><section class="stat"><p class="label">유해인 지출 실적</p><p class="value num">'+num(past.reduce((a,x)=>a+x.amount,0))+'<span>원</span></p><p class="subtle">원본 정산표 '+past.length+'개 항목</p></section><section class="stat"><p class="label">유태현 실제 지급</p><p class="value num">'+(current.some(x=>!x.cancelled&&x.kind==='actual')?num(actual)+'<span>원</span>':'미입력')+'</p><p class="subtle">계획 '+won(plan)+' · 기록한 지급분만 집계</p></section></div><div class="panel"><div class="panel-title"><h3>유태현 비용 기록</h3><span class="subtle">최종 잔액은 비용 입력 완료 후 판단</span></div><table class="ledger"><thead><tr><th>항목</th><th>계획/실적</th><th>금액</th><th>날짜</th></tr></thead><tbody>'+current.map(x=>'<tr><td>'+esc(x.category)+(x.cancelled?' <span class="badge warn">취소됨</span>':'')+'</td><td data-label="구분">'+(x.kind==='plan'?'계획':'실제 지급')+'</td><td class="num" data-label="금액">'+won(x.amount)+'</td><td data-label="날짜">'+esc(x.date)+(!x.cancelled&&user.role!=='viewer'?'<div class="rowbar"><button class="ghost" data-edit-expense="'+esc(x.id)+'">수정</button><button class="ghost danger" data-cancel-expense="'+esc(x.id)+'">취소</button></div>':'')+'</td></tr>').join('')+(!current.length?'<tr><td colspan="4" class="empty">아직 입력한 비용이 없습니다.</td></tr>':'')+'</tbody></table></div><details><summary>유해인 과거 지출 '+won(past.reduce((a,x)=>a+x.amount,0))+'</summary>'+past.map(x=>'<p class="subtle">'+esc(x.category)+' · '+won(x.amount)+'</p>').join('')+'</details>';}

function receiptForm(pid=null,rid=null){selectedPerson=state.people.find(p=>p.id===pid)||null;pendingOperation=null;const r=state.receipts.find(x=>x.id===rid);modal(head(r?'입금 기록 수정':'축의금 기록')+'<form id="receipt-form" data-edit="'+esc(rid||'')+'"><label class="field">이름<input id="person-query" autocomplete="off" placeholder="이름을 검색하거나 새 이름 입력" value="'+esc(selectedPerson?.name||'')+'"'+(r?' readonly':'')+' required></label><div id="suggestions" class="suggestions" hidden></div><p id="person-info" class="subtle" style="margin-bottom:12px">'+(selectedPerson?esc(selectedPerson.group)+' · 유해인 '+(selectedPerson.reference?won(selectedPerson.reference.amount):'과거 기록 없음'):'기존 명단은 검색 결과에서 선택해 주세요.')+'</p><label class="field" id="new-group-field"'+(selectedPerson?' hidden':'')+'>새 명단 그룹<select id="new-group">'+options(group||'기타',false)+'</select></label><label class="checkline" id="new-person-confirm" hidden><input id="confirm-new" type="checkbox">동명이인으로 새 명단 등록</label><label class="field">금액 (원)<input id="amount" inputmode="numeric" value="'+(r?num(r.amount):'')+'" placeholder="예: 100,000" required></label><div class="quick">'+[50000,100000,200000,300000,500000,1000000].map(n=>'<button type="button" data-quick="'+n+'">'+n/10000+'만 원</button>').join('')+'</div><label class="field">입금방법<select id="method">'+['봉투','계좌','카드','기타'].map(m=>'<option'+(r?.method===m?' selected':'')+'>'+m+'</option>').join('')+'</select></label><div class="form-grid"><label class="field">입금일<input id="date" type="date" value="'+(r?.date||today())+'" required></label><label class="field">메모 (선택)<input id="memo" maxlength="500" value="'+esc(r?.note||'')+'" placeholder="봉투 번호, 전달자 등"></label></div>'+(r?'<label class="field">수정 사유<input id="reason" maxlength="300" required></label>':'<label class="checkline" id="separate-field" hidden><input id="confirm-separate" type="checkbox">중복 후보와 별도의 추가 입금입니다.</label><label class="field" id="reason-field" hidden>별도 입금 사유<input id="reason" maxlength="300"></label>')+'<div class="error" id="form-error" role="alert" hidden></div><div class="actions"><button type="button" class="secondary" data-close>취소</button>'+(!r?'<button type="submit" class="secondary" name="continue" value="yes">저장 후 계속</button>':'')+'<button type="submit" class="primary">'+(r?'수정 저장':'저장')+'</button></div></form>');}
function personDetail(pid){const p=state.people.find(x=>x.id===pid);if(!p)return;const rr=state.receipts.filter(r=>r.personId===pid).sort((a,b)=>b.date.localeCompare(a.date));modal(head(esc(p.name))+'<p class="subtle">'+esc(p.group)+' · '+(p.reference?'원번호 '+p.reference.originalNo:'신규 명단')+'</p><div class="small-grid" style="margin:16px 0"><div class="summary-item"><span class="subtle">유해인 과거</span><b class="num">'+(p.reference?won(p.reference.amount):'기록 없음')+'</b></div><div class="summary-item"><span class="subtle">유태현 누적</span><b class="num">'+(personTotal(state,p.id)?won(personTotal(state,p.id)):'미기록')+'</b></div></div><label class="field">청첩 상태<select id="invitation" data-invitation="'+esc(p.id)+'"'+(user.role==='viewer'?' disabled':'')+'>'+[['unknown','미확인'],['sent','발송'],['notSent','미발송']].map(([v,t])=>'<option value="'+v+'"'+(p.invitation===v?' selected':'')+'>'+t+'</option>').join('')+'</select></label><h3>입금 이력</h3>'+rr.map(r=>'<div class="history-item '+(r.cancelled?'cancelled':'')+'"><b class="num">'+won(r.amount)+'</b> <span class="badge '+(r.cancelled?'warn':'ok')+'">'+(r.cancelled?'취소됨':'유효 입금')+'</span><p class="subtle">'+esc(r.date)+' · '+esc(r.method)+' · '+esc(r.createdBy)+'</p><p class="subtle">'+esc(r.note)+'</p>'+(!r.cancelled&&user.role!=='viewer'?'<div class="rowbar"><button class="ghost" data-edit="'+esc(r.id)+'">수정</button><button class="ghost danger" data-cancel="'+esc(r.id)+'">기록 취소</button></div>':'')+'</div>').join('')+(!rr.length?'<p class="hint">아직 기록한 입금이 없습니다.</p>':'')+(p.reference?.note?'<details><summary>과거 메모</summary><p class="subtle">'+esc(p.reference.note)+'</p></details>':'')+'<div class="actions"><button class="secondary" data-close>닫기</button>'+(user.role!=='viewer'?'<button class="primary" data-add="'+esc(p.id)+'">추가 입금 기록</button>':'')+'</div>');}
async function submitReceipt(e){e.preventDefault();if(busy)return;const editing=e.target.dataset.edit,name=$('#person-query').value.trim(),raw=$('#amount').value.trim();if(!/^(?:\d+|\d{1,3}(?:,\d{3})+)$/.test(raw))return error('금액을 올바른 원 단위 숫자로 입력해 주세요.');const amount=Number(raw.replace(/,/g,''));let pid=selectedPerson?.id,newPerson=null;if(!pid){if(state.people.some(p=>p.name.replace(/\s/g,'')===name.replace(/\s/g,''))&&!$('#confirm-new').checked)return error('검색 결과의 기존 명단을 선택하거나 동명이인 새 명단 등록을 확인해 주세요.');pid=pendingOperation?.body?.newPerson?.id||id();newPerson={id:pid,name,group:$('#new-group').value};}const body={personId:pid,amount,date:$('#date').value,method:$('#method').value,note:$('#memo').value.trim(),reason:$('#reason').value.trim()};if(editing)body.receiptId=editing;else Object.assign(body,{newPerson,receiptId:pendingOperation?.body?.receiptId||id(),confirmSeparate:$('#confirm-separate').checked});const op={id:pendingOperation?.id||id(),type:editing?'editReceipt':'addReceipt',body};pendingOperation=op;const keep=e.submitter?.name==='continue';busy=true;e.target.querySelectorAll('button').forEach(b=>b.disabled=true);try{await mutate(op);busy=false;close();tab='records';archive=false;page=1;render();notice(name+' '+won(amount)+' 저장 완료');if(keep)receiptForm();}catch(err){busy=false;e.target.querySelectorAll('button').forEach(b=>b.disabled=false);error(err.message);if(err.status===409||err.message.includes('같은 명단·')){$('#separate-field')?.removeAttribute('hidden');$('#reason-field')?.removeAttribute('hidden');}if(err.status!==0)pendingOperation=null;}}
function expenseForm(eid=null){const x=state.expenses.find(x=>x.id===eid);modal(head(x?'비용 수정':'비용 기록')+'<form id="expense-form" data-edit="'+esc(eid||'')+'"><label class="field">항목<input id="category" required maxlength="100" value="'+esc(x?.category||'')+'" placeholder="예: 식대"></label><div class="form-grid"><label class="field">구분<select id="kind"><option value="actual"'+(x?.kind==='actual'?' selected':'')+'>실제 지급</option><option value="plan"'+(x?.kind==='plan'?' selected':'')+'>계획</option></select></label><label class="field">날짜<input id="expense-date" type="date" value="'+(x?.date||today())+'" required></label></div><label class="field">금액 (원)<input id="expense-amount" inputmode="numeric" value="'+(x?num(x.amount):'')+'" required></label>'+(x?'<label class="field">수정 사유<input id="expense-reason" maxlength="300" required></label>':'')+'<div class="error" id="form-error" role="alert" hidden></div><div class="actions"><button type="button" class="secondary" data-close>취소</button><button type="submit" class="primary">저장</button></div></form>');}
function menu(){modal(head('보관·설정')+'<p class="subtle">'+(LOCAL?'이 기기에 저장하는 개발본입니다. 서버 배포 후 가족 기기에서 함께 사용할 수 있습니다.':'서버 저장 · '+esc(user.email))+'</p><div class="menu-list"><button class="secondary" data-export="json">전체 백업 다운로드 (JSON)</button><button class="secondary" data-export="csv">축의금 명단 다운로드 (CSV)</button><button class="secondary" data-export="transactions">입금 이력 다운로드 (CSV)</button>'+(user.role==='admin'?'<button class="secondary" data-import>JSON 백업 복원</button>':'')+'<button class="secondary" data-history>수정·입력 이력 보기</button><button class="secondary" data-refresh>최신 기록 다시 불러오기</button></div><p class="hint">JSON은 원본·거래·수정 이력을 모두 보관합니다. CSV는 조회용 내보내기이며 복원용이 아닙니다.</p><input id="backup-file" type="file" accept="application/json,.json" hidden><div class="error" id="form-error" role="alert" hidden></div>');}
function download(content,type,name){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
const cell=s=>'"'+String(s??'').replace(/"/g,'""').replace(/^[=+@-]/,"'$&")+'"';
async function backup(){const data=JSON.stringify(state),hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(data))),x=>x.toString(16).padStart(2,'0')).join('');download(JSON.stringify({app:'family-gift-ledger',format:1,exportedAt:new Date().toISOString(),checksum:hash,state},null,2),'application/json','가족축의금_전체백업_'+today()+'.json');}
function csv(transactions=false){const rows=transactions?[['거래ID','명단ID','성명','그룹','금액(원)','입금일','입금방법','메모','상태','작성자'],...state.receipts.map(r=>{const p=state.people.find(x=>x.id===r.personId);return[r.id,p.id,p.name,p.group,r.amount,r.date,r.method,r.note,r.cancelled?'취소':'유효',r.createdBy];})]:[['명단ID','원번호','성명','그룹','유해인금액(원)','유태현누적(원)','청첩상태'],...state.people.map(p=>[p.id,p.reference?.originalNo,p.name,p.group,p.reference?.amount,personTotal(state,p.id)||'',{unknown:'미확인',sent:'발송',notSent:'미발송'}[p.invitation]])];download('\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8','가족축의금_'+(transactions?'입금이력':'명단')+'_'+today()+'.csv');}
async function importBackup(file){try{if(file.size>8*1024*1024)throw Error('백업은 8MB 이하여야 합니다.');const packet=JSON.parse(await file.text());if(packet.app!=='family-gift-ledger'||packet.format!==1||!packet.checksum)throw Error('이 앱에서 내보낸 JSON 백업을 선택해 주세요.');validateState(packet.state);const data=JSON.stringify(packet.state),hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(data))),x=>x.toString(16).padStart(2,'0')).join('');if(hash!==packet.checksum)throw Error('백업 내용이 바뀌었거나 손상되었습니다.');const t=stats(packet.state);if(!confirm('이 백업으로 현재 기록을 교체합니다.\n명단 '+packet.state.people.length+'건 / 입금 '+t.transactions+'건 / '+won(t.total)+'\n현재 기록을 먼저 백업했는지 확인하세요.'))return;if(LOCAL){const write=()=>{const old=readLocal();if(old.revision!==revision)throw Error('다른 창의 기록이 바뀌었습니다. 최신 기록을 확인하고 다시 복원해 주세요.');const restored=structuredClone(packet.state);restored.audit.push({operationId:id(),action:'restore',actor:user.email,at:new Date().toISOString(),before:{revision},after:{receipts:restored.receipts.length}});localStorage.setItem(KEY,JSON.stringify({state:restored,revision:revision+1}));return restored;};state=navigator.locks?await navigator.locks.request(KEY,write):write();revision++;}else{const r=await fetch('/api/restore',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({state:packet.state,expectedRevision:revision}),credentials:'same-origin'}),result=await r.json();if(!r.ok)throw Error(result.error);state=result.state;revision=result.revision;}close();render();notice('백업 복원 완료');}catch(e){error(e.message);}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||busy)return;try{
 if(b.hasAttribute('data-nav')){tab=b.dataset.nav;archive=false;query='';group='';page=1;render();}
 else if(b.hasAttribute('data-close'))close();
 else if(b.hasAttribute('data-add')){if($('#modal').open)close();receiptForm(b.dataset.add||null);}
 else if(b.hasAttribute('data-person'))personDetail(b.dataset.person);
 else if(b.hasAttribute('data-filter')){filter=b.dataset.filter;page=1;render();}
 else if(b.hasAttribute('data-page')){page+=Number(b.dataset.page);render();}
 else if(b.hasAttribute('data-mode')){compareMode=b.dataset.mode;page=1;render();}
 else if(b.hasAttribute('data-archive')){archive=b.dataset.archive==='true';filter='all';page=1;render();}
 else if(b.hasAttribute('data-quick')){pendingOperation=null;$('#amount').value=num(Number(b.dataset.quick));}
 else if(b.hasAttribute('data-pick')){pendingOperation=null;selectedPerson=state.people.find(p=>p.id===b.dataset.pick);$('#person-query').value=selectedPerson.name;$('#person-info').textContent=selectedPerson.group+' · 유해인 '+(selectedPerson.reference?won(selectedPerson.reference.amount):'과거 기록 없음');$('#suggestions').hidden=true;$('#new-group-field').hidden=true;$('#new-person-confirm').hidden=true;}
 else if(b.hasAttribute('data-edit')){const r=state.receipts.find(x=>x.id===b.dataset.edit);close();receiptForm(r.personId,r.id);}
 else if(b.hasAttribute('data-cancel')){const reason=prompt('취소 사유를 입력해 주세요. 원본과 이력은 남습니다.');if(!reason?.trim())return;await mutate({id:id(),type:'cancelReceipt',body:{receiptId:b.dataset.cancel,reason}});close();render();notice('기록을 취소했습니다.');}
 else if(b.hasAttribute('data-expense'))expenseForm();
 else if(b.hasAttribute('data-edit-expense'))expenseForm(b.dataset.editExpense);
 else if(b.hasAttribute('data-cancel-expense')){const reason=prompt('비용 취소 사유를 입력해 주세요. 이력은 남습니다.');if(!reason?.trim())return;await mutate({id:id(),type:'cancelExpense',body:{expenseId:b.dataset.cancelExpense,reason}});render();notice('비용 기록 취소 완료');}
 else if(b.id==='menu-button')menu();
 else if(b.dataset.export==='json')await backup();else if(b.dataset.export==='csv')csv();else if(b.dataset.export==='transactions')csv(true);
 else if(b.hasAttribute('data-import'))$('#backup-file').click();
 else if(b.hasAttribute('data-history')){close();modal(head('입력·수정 이력')+state.audit.slice(-100).reverse().map(a=>'<div class="history-item"><b>'+esc({addReceipt:'입금 추가',editReceipt:'입금 수정',cancelReceipt:'입금 취소',addExpense:'비용 추가',editExpense:'비용 수정',cancelExpense:'비용 취소',setInvitation:'청첩 변경',restore:'백업 복원'}[a.action]||a.action)+'</b><p class="subtle">'+esc(a.at)+' · '+esc(a.actor)+'</p><p class="subtle">'+esc(a.reason||'')+'</p></div>').join('')+'<p class="hint">최근 100건 표시 · 전체 이력은 JSON 백업에 포함됩니다.</p>');}
 else if(b.hasAttribute('data-refresh')){await reload();close();render();notice('최신 기록을 불러왔습니다.');}
 }catch(err){error(err.message);}
});
document.addEventListener('input',e=>{if(e.target.closest('#receipt-form'))pendingOperation=null;if(e.target.id==='query'){query=e.target.value;page=1;render();}if(e.target.id==='person-query'){selectedPerson=null;pendingOperation=null;const q=e.target.value.trim(),matches=state.people.filter(p=>p.name.includes(q)).slice(0,6);$('#person-info').textContent='기존 명단을 선택하거나 새 이름과 그룹을 입력해 주세요.';$('#new-group-field').hidden=false;$('#new-person-confirm').hidden=!state.people.some(p=>p.name===q);$('#suggestions').hidden=!q||!matches.length;$('#suggestions').innerHTML=matches.map(p=>'<button type="button" data-pick="'+esc(p.id)+'"><span>'+esc(p.name)+'</span><small class="subtle">'+esc(p.group)+' · '+(p.reference?'원번호 '+p.reference.originalNo:'신규')+'</small></button>').join('');}});
document.addEventListener('change',async e=>{try{if(e.target.closest('#receipt-form'))pendingOperation=null;if(e.target.id==='group'){group=e.target.value;page=1;render();}if(e.target.id==='sort'){sort=e.target.value;page=1;render();}if(e.target.dataset.invitation){await mutate({id:id(),type:'setInvitation',body:{personId:e.target.dataset.invitation,value:e.target.value}});render();notice('청첩 상태 저장 완료');}if(e.target.id==='backup-file'&&e.target.files[0])await importBackup(e.target.files[0]);}catch(err){error(err.message);}});
document.addEventListener('submit',async e=>{if(e.target.id==='receipt-form')return submitReceipt(e);if(e.target.id==='expense-form'){e.preventDefault();if(busy)return;const raw=$('#expense-amount').value.trim();if(!/^(?:\d+|\d{1,3}(?:,\d{3})+)$/.test(raw))return error('금액을 원 단위 숫자로 입력해 주세요.');busy=true;try{await mutate({id:id(),type:e.target.dataset.edit?'editExpense':'addExpense',body:{expenseId:e.target.dataset.edit||id(),reason:$('#expense-reason')?.value.trim()||'',category:$('#category').value,kind:$('#kind').value,date:$('#expense-date').value,amount:Number(raw.replace(/,/g,''))}});busy=false;close();render();notice('비용 저장 완료');}catch(err){busy=false;error(err.message);}}});
$('#modal').addEventListener('cancel',e=>{if(busy)e.preventDefault();});
window.addEventListener('storage',async e=>{if(LOCAL&&e.key===KEY&&!$('#modal').open){try{await reload();render();}catch(err){status(err.message,true);}}});
document.addEventListener('visibilitychange',async()=>{if(!LOCAL&&!document.hidden&&!$('#modal').open){try{await reload();render();}catch(err){status(err.message,true);}}});
try{await reload();render();}catch(err){storageReady=false;if(LOCAL){state=validateState(structuredClone(window.GIFT_APP_LOCAL_SEED));render();}else $('#view').innerHTML='<div class="callout">'+esc(err.message)+'</div>';status('저장 연결 안 됨 · '+err.message,true);}
</script></body></html>
